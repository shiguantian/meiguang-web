<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">各种作业不良的详细说明</title>
  <desc id="desc">客户内工厂间运输造成的 ACF 作业不良案例说明</desc>
  <rect width="1100" height="820" fill="#f7fbff"/>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1476d4"/>
      <stop offset="1" stop-color="#2aa8f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#234" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1100" height="96" fill="url(#top)"/>
  <text x="24" y="40" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="800" fill="#fff">3.各种作业不良的详细说明</text>
  <text x="24" y="78" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="800" fill="#fff">~ 客户内 工厂间运输造成的不良事例 ~</text>
  <text x="852" y="38" font-family="Arial, sans-serif" font-size="30" font-style="italic" fill="#fff">Hitachi Chemical</text>
  <text x="892" y="66" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#e8f5ff">Working On Wonders</text>
  <text x="1054" y="24" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">40</text>

  <rect x="24" y="112" width="1052" height="390" fill="#b9dcff" stroke="#21476b" stroke-width="2"/>
  <g font-family="'Microsoft YaHei', Arial, sans-serif" font-weight="800" font-size="28" fill="#000">
    <rect x="72" y="132" width="214" height="42" fill="#9c9c9c"/>
    <text x="100" y="162">包装品保仓库</text>
    <rect x="412" y="132" width="214" height="42" fill="#9c9c9c"/>
    <text x="480" y="162">保冷车</text>
    <rect x="774" y="132" width="214" height="42" fill="#9c9c9c"/>
    <text x="817" y="162">货代者仓库</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="182" width="230" height="260" fill="#fff"/>
    <rect x="84" y="208" width="146" height="196" fill="#f1f1f1" stroke="#999"/>
    <g stroke="#777" stroke-width="1">
      <path d="M84 230h146M84 252h146M84 274h146M84 296h146M84 318h146M84 340h146M84 362h146M84 384h146"/>
      <path d="M104 208v196M132 208v196M160 208v196M188 208v196M216 208v196"/>
    </g>
    <rect x="382" y="204" width="340" height="212" fill="#fff"/>
    <rect x="404" y="224" width="290" height="152" fill="#eee" stroke="#999"/>
    <path d="M410 316c50-10 92-6 128 10 42 18 92 15 154-12" fill="none" stroke="#666" stroke-width="2"/>
    <path d="M410 344c60-8 110-5 154 9 44 14 86 15 128 2" fill="none" stroke="#888" stroke-width="2"/>
    <rect x="354" y="404" width="126" height="38" fill="none" stroke="#e22" stroke-width="4" stroke-dasharray="14 8"/>
    <rect x="666" y="286" width="54" height="42" fill="none" stroke="#e22" stroke-width="4" stroke-dasharray="14 8"/>
    <rect x="765" y="182" width="230" height="260" fill="#fff"/>
    <rect x="792" y="216" width="150" height="180" fill="#f8f8f8" stroke="#aaa"/>
    <path d="M802 350c44-8 84-8 130 0" stroke="#777" stroke-width="3" fill="none"/>
    <rect x="800" y="334" width="134" height="42" fill="none" stroke="#e22" stroke-width="4" stroke-dasharray="14 8"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1f328c">
    <text x="574" y="412">-20°C</text>
    <text x="858" y="326">-20°C</text>
  </g>
  <g stroke="#111" stroke-width="3" fill="none">
    <path d="M626 392l72-66"/>
    <path d="M872 334l35-72"/>
  </g>
  <rect x="73" y="458" width="956" height="42" fill="#fff576"/>
  <text x="92" y="488" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="800" fill="#000">在我司保证内的运送(协议约定的交货地为止)，是在</text>
  <text x="704" y="488" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="800" fill="#e22">推荐保管温度</text>
  <text x="886" y="488" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="800" fill="#000">下进行管理。</text>

  <g font-family="'Microsoft YaHei', Arial, sans-serif">
    <rect x="98" y="535" width="96" height="70" fill="#c6eef0" stroke="#37646b" stroke-width="2"/>
    <text x="122" y="580" font-size="28" fill="#111">ACF</text>
    <rect x="72" y="620" width="148" height="44" fill="#05aee9" stroke="#005b78" stroke-width="2"/>
    <text x="90" y="652" font-size="28" fill="#001">日立化成</text>
    <rect x="486" y="532" width="96" height="70" fill="#c6eef0" stroke="#37646b" stroke-width="2"/>
    <text x="510" y="578" font-size="28" fill="#111">ACF</text>
    <rect x="420" y="620" width="230" height="44" fill="#05aee9" stroke="#005b78" stroke-width="2"/>
    <text x="468" y="652" font-size="28" fill="#001">客户A工厂</text>
    <rect x="900" y="532" width="96" height="70" fill="#fffb00" stroke="#222" stroke-width="2"/>
    <text x="924" y="578" font-size="28" fill="#111">ACF</text>
    <rect x="862" y="620" width="216" height="44" fill="#05aee9" stroke="#005b78" stroke-width="2"/>
    <text x="910" y="652" font-size="28" fill="#001">客户B工厂</text>
  </g>
  <g stroke="#111" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0 10 5 0 10z" fill="#111"/>
      </marker>
    </defs>
    <path d="M198 568h280"/>
    <path d="M586 568h300"/>
  </g>
  <text x="256" y="558" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="28" fill="#111">运输(我司保证)</text>
  <text x="254" y="598" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="800" fill="#e22">*协议上的交货场所为止</text>
  <text x="638" y="558" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="28" fill="#111">运输(我司保证外)</text>
  <path d="M692 520l118 92M810 520l-118 92" stroke="#e22" stroke-width="2"/>

  <g font-family="'Microsoft YaHei', Arial, sans-serif" font-size="25" font-weight="700">
    <text x="48" y="712" fill="#000">我司在向与客户进行产品运输时，是在</text>
    <text x="508" y="712" fill="#e22">推荐保管条件</text>
    <text x="660" y="712" fill="#000">下进行运输管理。</text>
    <text x="48" y="746" fill="#000">方贵司在向其他 工厂 进行运输时，是在我司</text>
    <text x="610" y="746" fill="#e22">非我司保证范围</text>
    <text x="804" y="746" fill="#000">的，请进行注意。</text>
    <text x="48" y="780" fill="#000">※如果其他工厂需要单独送货时，请与我司另行商讨。我们将检讨是否直接出货等运送方法。</text>
  </g>
</svg>
